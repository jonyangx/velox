# demo-consumer 开发默认配置（镜像 demo-provider 的配置结构 + mesh 出口；生产配置不入库）
# 运行：target/debug/demo-consumer velox-demo/consumer/config/demo-consumer.toml
# 覆盖：VELOX_CONSUMER__<SECTION>__<FIELD> 环境变量（双下划线分层，见 velox-demo/README.md）

[server]
addr = "0.0.0.0:9100"

[registry]
endpoint = "http://127.0.0.1:8300"  # velox-registry
service_name = "demo-consumer"
advertise_host = "127.0.0.1"
advertise_port = 9100
heartbeat_interval_secs = 5

[mesh]
endpoint = "http://127.0.0.1:8100"  # velox-mesh 数据面（per-host sidecar，见架构文档 §3.1）

# 子系统日志（addlog）：进程自身写本地文件并按大小轮转，保留含活跃共 3 份、
# 单份 200 MiB 硬上限（总预算 600 MiB/进程；轮转参数为内部常量，不开放生产配置）。
# 文件：<dir>/<包名>.log（归档 .log.1/.log.2）；默认 warn（静默 INFO，排障用 RUST_LOG=info）。
# 覆盖：VELOX_<前缀>__LOG__DIR / VELOX_<前缀>__LOG__LEVEL 环境变量（LOG__LEVEL 严格语法，
# 含空串拒绝；RUST_LOG 保留 EnvFilter 完整语法且优先级最高，调级须重启）。
[log]
dir = "logs"
level = "warn"
