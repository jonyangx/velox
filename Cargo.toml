[workspace]
resolver = "2"
members = [
    "velox-mesh",
    "velox-config",
    "velox-registry",
    "velox-demo/provider",
    "velox-demo/consumer",
    "velox-log",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["velox contributors"]

# 统一依赖版本：所有 crate 必须从这里引用（dep = { workspace = true }）
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
velox-log = { path = "velox-log" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = { version = "=0.2.4", default-features = false }
anyhow = "1"
thiserror = "2"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
