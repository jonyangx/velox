# velox-registry 开发默认配置（生产配置不入库，见开发规范第 5 节）

[server]
addr = "0.0.0.0:8300"

[registry]
# 心跳超过该时长未续约的实例视为失联
heartbeat_ttl_secs = 30
# 后台剔除任务的扫描周期
sweep_interval_secs = 5

# v0.2 状态持久化（FR-5）：注册/注销即时写穿，心跳按周期合并刷盘，
# 重启恢复按绝对时间 TTL 过滤。快照文件为 <data_dir>/registry/registry-state.json。
[persistence]
# 是否启用落盘与恢复（默认开启；false = 与 v0.1 完全一致的排障逃生门）
enabled = true
# 落盘根目录（快照实际存放在其 registry/ 专属子目录，避开 velox-config 顶层扫描）
data_dir = "./data"
# 心跳脏快照刷盘周期（秒）；启用持久化时必须 < heartbeat_ttl_secs
flush_interval_secs = 5

# 子系统日志（addlog）：进程自身写本地文件并按大小轮转，保留含活跃共 3 份、
# 单份 200 MiB 硬上限（总预算 600 MiB/进程；轮转参数为内部常量，不开放生产配置）。
# 文件：<dir>/<包名>.log（归档 .log.1/.log.2）；默认 warn（静默 INFO，排障用 RUST_LOG=info）。
# 覆盖：VELOX_<前缀>__LOG__DIR / VELOX_<前缀>__LOG__LEVEL 环境变量（LOG__LEVEL 严格语法，
# 含空串拒绝；RUST_LOG 保留 EnvFilter 完整语法且优先级最高，调级须重启）。
[log]
dir = "logs"
level = "warn"
