# velox-mesh 开发默认配置（生产配置不入库，见开发规范第 5 节）

[server]
inbound_addr = "0.0.0.0:8100"    # 数据面：业务容器出口流量
admin_addr   = "127.0.0.1:8101"  # 管理面：仅本机可访问

[registry]
endpoint = "http://127.0.0.1:8300"  # velox-registry 地址
poll_secs = 5                       # 服务快照刷新周期

[proxy]
connect_timeout_secs = 3
request_timeout_secs = 30

# 子系统日志（addlog）：进程自身写本地文件并按大小轮转，保留含活跃共 3 份、
# 单份 200 MiB 硬上限（总预算 600 MiB/进程；轮转参数为内部常量，不开放生产配置）。
# 文件：<dir>/<包名>.log（归档 .log.1/.log.2）；默认 warn（静默 INFO，排障用 RUST_LOG=info）。
# 覆盖：VELOX_<前缀>__LOG__DIR / VELOX_<前缀>__LOG__LEVEL 环境变量（LOG__LEVEL 严格语法，
# 含空串拒绝；RUST_LOG 保留 EnvFilter 完整语法且优先级最高，调级须重启）。
[log]
dir = "logs"
level = "warn"
