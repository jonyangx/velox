# velox-config 开发默认配置（生产配置不入库，见开发规范第 5 节）

[server]
addr = "0.0.0.0:8200"
max_concurrent_requests = 10  # 单实例最大并发处理请求数，合法域 1..=U（U=min(i64::MAX, usize::MAX, Semaphore::MAX_PERMITS)，随平台）

[storage]
# SQLite 库文件 velox-config.db（及 WAL/SHM 副文件）所在目录；
# 首次启动会自动导入目录中的旧版 {namespace}.json 并改名 .json.migrated
data_dir = "./data"

# 子系统日志（addlog）：进程自身写本地文件并按大小轮转，保留含活跃共 3 份、
# 单份 200 MiB 硬上限（总预算 600 MiB/进程；轮转参数为内部常量，不开放生产配置）。
# 文件：<dir>/<包名>.log（归档 .log.1/.log.2）；默认 warn（静默 INFO，排障用 RUST_LOG=info）。
# 覆盖：VELOX_<前缀>__LOG__DIR / VELOX_<前缀>__LOG__LEVEL 环境变量（LOG__LEVEL 严格语法，
# 含空串拒绝；RUST_LOG 保留 EnvFilter 完整语法且优先级最高，调级须重启）。
[log]
dir = "logs"
level = "warn"

[cache]
# namespace 读缓存 TTL（秒）：写操作即时驱逐缓存（读己之写不受影响）；
# 0 = 禁用缓存
ttl_secs = 300
